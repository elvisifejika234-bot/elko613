<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Elvis</title>
</head>

<body>
    <header class="header">
        <a href="index.html" class="logo">E</a>
        <nav class="menu">
            <a href="index.html" class="links">Home</a>
            <a href="projects.html" class="links">Projects</a>
            <a href="contact.html" class="links active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero-section contact-section" style="grid-template-columns:1fr; display:block;">
            <div class="hero-content">
                <h1>Get In <span class="span">Touch</span></h1>
                <h3>Let's work <span>together</span></h3>
                <p>Have a project in mind, want to collaborate, or just want to say hi? Reach out
                    directly or through the form below.</p>

                <div class="contact-details">
                    <span>📞 0802 636 3090</span>
                    <a href="mailto:elvisifejika234@gmail.com">elvisifejika234@gmail.com</a>
                </div>

                <form class="contact-form" action="https://formspree.io/f/xaeqarnw" method="POST">
                    <div class="input-group">
                        <input type="text" name="name" placeholder="Your name" required>
                        <input type="email" name="_replyto" placeholder="Your email" required>
                    </div>
                    <input type="text" class="subject-input" name="_subject" placeholder="Subject">
                    <textarea name="message" rows="6" placeholder="Tell me about your project" required></textarea>
                    <button type="submit" class="btn">Send Message</button>
                </form>

                <div class="social-icons" style="margin-top: 2.5rem;">
                    <a href="#" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
                    <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Elvis. All rights reserved.</p>
    </footer>
</body>

</html>
